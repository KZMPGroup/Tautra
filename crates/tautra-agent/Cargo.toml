[package]
name = "tautra-agent"
description = "Proses agent Tautra per sesi pengguna"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tautra-agent"
path = "src/main.rs"

[features]
devlog = ["tautra-common/devlog"]

[dependencies]
tautra-common.workspace = true
tautra-ipc.workspace = true
tautra-proto.workspace = true
tautra-net.workspace = true
tautra-input.workspace = true
tautra-transfer.workspace = true
tautra-clipboard.workspace = true
bytes.workspace = true
quinn.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
toml.workspace = true

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

[target.'cfg(windows)'.dependencies]
tautra-service = { path = "../tautra-service" }
windows = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
